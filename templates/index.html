{% extends "base.html" %}

{% block body %}

    <form action="/register" method="post">
        <input autocomplete="off" autofocus placeholder="Name" required name="name" type="text">
        {% for sport in sports %}
            <input name="sport" type="radio" value="{{ sport }}"> {{ sport }}
        {% endfor %}
        <button type="submit">Register</button>
    </form>

{% endblock %}
